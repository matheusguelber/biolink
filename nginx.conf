# Configuração Nginx para Ubuntu Server
# Coloque em /etc/nginx/sites-available/biolink e crie o link simbólico para /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name seudominio.com www.seudominio.com; # Substitua pelo seu domínio ou IP

    root /var/www/biolink;
    index index.html;

    # Gzip Compression para máxima velocidade
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
