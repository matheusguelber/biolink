# Configuração Nginx com Proxy para o Servidor Node.js + Firebase Cloud Sync
# Coloque em /etc/nginx/sites-available/biolink e crie o link simbólico para /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name seudominio.com www.seudominio.com; # Substitua pelo seu domínio ou IP

    root /var/www/biolink;
    index index.html;

    # Gzip Compression para máxima velocidade
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API Backend (Node.js Express + Firebase)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Arquivos Estáticos & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (exceto API)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
