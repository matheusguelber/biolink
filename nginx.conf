# Configuração Nginx com Proxy para Node.js + Desativação de Cache para JS/HTML
# Coloque em /etc/nginx/sites-available/biolink e crie o link simbólico para /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name servidormatheus.com www.servidormatheus.com _;

    root /var/www/biolink;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API Backend (Node.js Express + Firebase)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Desativa cache de scripts JS e HTML para carregar atualizações instantaneamente
    location ~* \.(html|js|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache apenas para mídias pesadas (imagens, fontes, músicas)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Routing padrão
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}
